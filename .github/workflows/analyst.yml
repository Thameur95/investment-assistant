name: Analyst Agent Shadow
on:
  workflow_dispatch:
  schedule:
    - cron: "15 21 * * 1-5"
permissions:
  contents: write
concurrency:
  group: analyst-agent-shadow
  cancel-in-progress: true
jobs:
  analyst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Analyst Agent
        run: python Agents/analyst/analyst_agent.py
      - name: Save Analyst observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agents/analyst/results/analyst_observations.csv Agents/analyst/results/analyst_summary.json
          git diff --cached --quiet || git commit -m "Update Analyst Shadow observations"
          git push
