name: Collect OOS and Validate V2

on:
  workflow_dispatch:
  schedule:
    - cron: "20 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: collect-oos-v2
  cancel-in-progress: false

jobs:
  collect-build-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Verify required files
        run: |
          test -s historical_lab/data/processed/historical_indicators.csv
          test -s historical_lab/scripts/replay_intraday_monitor.py
          test -s historical_lab/scripts/validate_v2_full.py

          python -m py_compile historical_lab/scripts/collect_oos_v2.py
          python -m py_compile historical_lab/scripts/replay_intraday_monitor.py
          python -m py_compile historical_lab/scripts/validate_v2_full.py

      - name: Collect and extend prospective OOS intraday cache
        run: |
          mkdir -p historical_lab/data/oos_v2/prospective/intraday

          python historical_lab/scripts/collect_oos_v2.py \
            --daily-file historical_lab/data/processed/historical_indicators.csv \
            --output-dir historical_lab/data/oos_v2/prospective/intraday \
            --period 60d

      - name: Build isolated OOS replay workspace
        run: |
          rm -rf historical_lab/_oos_workspace

          mkdir -p historical_lab/_oos_workspace/data/processed
          mkdir -p historical_lab/_oos_workspace/data/intraday
          mkdir -p historical_lab/_oos_workspace/scripts
          mkdir -p historical_lab/_oos_workspace/results

          cp historical_lab/data/processed/historical_indicators.csv \
             historical_lab/_oos_workspace/data/processed/historical_indicators.csv

          cp historical_lab/data/oos_v2/prospective/intraday/*_5m.csv \
             historical_lab/_oos_workspace/data/intraday/

          cp historical_lab/scripts/replay_intraday_monitor.py \
             historical_lab/_oos_workspace/scripts/replay_intraday_monitor.py

      - name: Replay V1 logic on prospective OOS cache
        run: |
          python historical_lab/_oos_workspace/scripts/replay_intraday_monitor.py

      - name: Freeze independent prospective OOS candidates
        env:
          OOS_FREEZE_DATE: "2026-10-10"
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd

          source = Path(
              "historical_lab/_oos_workspace/results/"
              "risk_manager_source_trades.csv"
          )

          target = Path(
              "historical_lab/data/oos_v2/prospective/"
              "risk_manager_source_trades.csv"
          )

          target.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          df = pd.read_csv(source)

          cutoff = pd.Timestamp(
              os.environ["OOS_FREEZE_DATE"]
          )

          session = pd.to_datetime(
              df["SessionDate"],
              errors="coerce",
          )

          columns = [
              "Ticker",
              "SignalDate",
              "SessionDate",
              "Decision",
              "DecisionTime",
              "TradeStatus",
              "ExitReason",
          ]

          available_columns = [
              column
              for column in columns
              if column in df.columns
          ]

          print()
          print("=" * 100)
          print(
              "DIAGNOSTIC REPLAY "
              "APRES CUTOFF OOS"
          )
          print("=" * 100)

          diagnostic = df.loc[
              session > cutoff
          ].copy()

          if diagnostic.empty:
              print(
                  "Aucune entree replay "
                  "apres le cutoff.
