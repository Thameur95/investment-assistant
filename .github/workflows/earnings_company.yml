name: Earnings Company Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  earnings-company:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Earnings Company Agent
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python Agents/earnings_company/earnings_company_agent.py
