name: Historical Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run download script
        run: |
          python historical_lab/scripts/download_history.py

      - name: Build database
        run: |
          python historical_lab/scripts/build_database.py

      - name: Save historical database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_lab/data/raw/
          git diff --cached --quiet || git commit -m "Update historical database"
          git push
