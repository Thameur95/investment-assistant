name: Historical Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run download script
        run: |
          python historical_lab/scripts/download_history.py

      - name: Build database
        run: |
          python historical_lab/scripts/build_database.py

      - name: Run Catalyst Agent
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python historical_lab/scripts/catalyst_agent.py

      - name: Classify Catalyst Events
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          CATALYST_MAX_EVENTS_PER_RUN: 60
        run: |
          python historical_lab/scripts/catalyst_semantic.py

      - name: Save Catalyst Reports
        run: |
          echo "=== Catalyst reports generated ==="
          ls -lah historical_lab/reports/ || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add historical_lab/reports/

          if git diff --cached --quiet; then
            echo "Aucun nouveau rapport Catalyst a sauvegarder."
          else
            echo "=== Files to commit ==="
            git diff --cached --name-only

            git commit -m "Update Catalyst reports"
            git push
          fi

      - name: Calculate indicators
        run: |
          python historical_lab/scripts/calculate_indicators.py
          
      - name: Download intraday data
        run: |
          python historical_lab/scripts/download_intraday.py
          
      - name: Replay intraday monitor
        run: |
          python historical_lab/scripts/replay_intraday_monitor.py

      - name: Analyze RVOL
        run: |
          python historical_lab/scripts/analyze_rvol.py
      
      - name: Backtest scanner
        run: |
          python historical_lab/scripts/backtest_scanner.py

      - name: Save historical database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical_lab/data/raw/ historical_lab/data/processed/
          git diff --cached --quiet || git commit -m "Update historical database"
          git push
