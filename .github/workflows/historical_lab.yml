name: Historical Lab

on:
  workflow_dispatch:

jobs:
  download-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run download script
        run: |
          python historical_lab/scripts/download_history.py
