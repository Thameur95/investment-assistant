name: News Impact Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "45 20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: news-impact-agent
  cancel-in-progress: false

jobs:
  news-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run News Impact Agent
        run: |
          python Agents/news_impact/news_impact_agent.py

      - name: Save News Impact results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agents/news_impact/results/news_impact_events.csv
          if git diff --cached --quiet; then
            echo "Aucun nouveau resultat News Impact a sauvegarder."
          else
            echo "=== Files to commit ==="
            git diff --cached --name-only
            git commit -m "Update News Impact observations"
            git pull --rebase
            git push
          fi
