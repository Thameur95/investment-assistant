name: News Impact Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run News Impact Agent
        run: |
          python Agents/news_impact/news_impact_agent.py
