{"name":"Safety Test","on":{"workflow_dispatch":{}},"permissions":{"contents":"read"},"jobs":{"test":{"runs-on":"ubuntu-latest","timeout-minutes":4,"steps":[{"name":"Checkout","uses":"actions/checkout@v4"},{"name":"Setup Python","uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"name":"Install packages","run":"pip install -r requirements.txt"},{"name":"Create alert test decisions","run":"python - <<'PY'\nimport csv\nfrom datetime import datetime, timedelta\nfrom zoneinfo import ZoneInfo\nnow = datetime.now(ZoneInfo('Europe/Paris'))\nfields = ['ticker','signal_date','session_date','decision_time','signal_price','opening_price','gap_pct','opening_range_high','opening_range_low','close_bougie_4','red_candles_4','initial_avg_volume','decision_open','decision_high','decision_low','decision_close','decision_volume','vwap','decision','next_state','reason']\nrows = [\n {'ticker':'VLO','signal_date':(now-timedelta(days=1)).strftime('%Y-%m-%d'),'session_date':(now-timedelta(days=1)).strftime('%Y-%m-%d'),'decision_time':(now-timedelta(hours=12)).isoformat(timespec='seconds'),'signal_price':410,'opening_price':405,'gap_pct':-1.22,'opening_range_high':410,'opening_range_low':404.21,'close_bougie_4':407,'red_candles_4':2,'initial_avg_volume':50000,'decision_open':418,'decision_high':420,'decision_low':417,'decision_close':419.51,'decision_volume':120000,'vwap':416.19,'decision':'ACHAT REACTIVE','next_state':'POSITION A OUVRIR','reason':'TEST DECISION PERIMEE'},\n {'ticker':'SAF.PA','signal_date':now.strftime('%Y-%m-%d'),'session_date':now.strftime('%Y-%m-%d'),'decision_time':now.isoformat(timespec='seconds'),'signal_price':99,'opening_price':99.5,'gap_pct':0.51,'opening_range_high':99.8,'opening_range_low':98.9,'close_bougie_4':99.7,'red_candles_4':1,'initial_avg_volume':5000,'decision_open':99.8,'decision_high':100.2,'decision_low':99.7,'decision_close':100,'decision_volume':8000,'vwap':99.6,'decision':'ACHAT CONFIRME','next_state':'POSITION A OUVRIR','reason':'TEST DECISION FRAICHE'}]\nwith open('intraday_decisions.csv','w',newline='',encoding='utf-8') as f:\n w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)\nwith open('intraday_alert_state.csv','w',newline='',encoding='utf-8') as f:\n w=csv.writer(f); w.writerow(['ticker','signal_date','session_date','decision','notified_at_paris'])\nprint('Deux décisions de test créées')\nPY"},{"name":"First alert test","env":{"TELEGRAM_BOT_TOKEN":"${{ secrets.TELEGRAM_BOT_TOKEN }}","TELEGRAM_CHAT_ID":"${{ secrets.TELEGRAM_CHAT_ID }}"},"run":"python intraday_alert.py"},{"name":"Second alert test no duplicate","env":{"TELEGRAM_BOT_TOKEN":"${{ secrets.TELEGRAM_BOT_TOKEN }}","TELEGRAM_CHAT_ID":"${{ secrets.TELEGRAM_CHAT_ID }}"},"run":"python intraday_alert.py"},{"name":"Show temporary alert state","run":"cat intraday_alert_state.csv"}]}}}
