{"name":"Safety Test","on":{"workflow_dispatch":{}},"permissions":{"contents":"read"},"jobs":{"test":{"runs-on":"ubuntu-latest","timeout-minutes":4,"steps":[{"name":"Checkout","uses":"actions/checkout@v4"},{"name":"Setup Python","uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"name":"Install packages","run":"pip install -r requirements.txt"},{"name":"Create fresh test decision","run":"python -c \"import csv; from datetime import datetime; from zoneinfo import ZoneInfo; now=datetime.now(ZoneInfo('Europe/Paris')); fields=['ticker','signal_date','session_date','decision_time','signal_price','opening_price','gap_pct','opening_range_high','opening_range_low','close_bougie_4','red_candles_4','initial_avg_volume','decision_open','decision_high','decision_low','decision_close','decision_volume','vwap','decision','next_state','reason']; row={'ticker':'SAF.PA','signal_date':now.strftime('%Y-%m-%d'),'session_date':now.strftime('%Y-%m-%d'),'decision_time':now.isoformat(timespec='seconds'),'signal_price':99,'opening_price':99.5,'gap_pct':0.51,'opening_range_high':99.8,'opening_range_low':98.9,'close_bougie_4':99.7,'red_candles_4':1,'initial_avg_volume':5000,'decision_open':99.8,'decision_high':100.2,'decision_low':99.7,'decision_close':100,'decision_volume':8000,'vwap':99.6,'decision':'ACHAT CONFIRME','next_state':'POSITION A OUVRIR','reason':'TEST DECISION FRAICHE'}; f=open('intraday_decisions.csv','w',newline='',encoding='utf-8'); w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerow(row); f.close(); print('Décision fraîche créée à',now.isoformat())\""},{"name":"Test portfolio protections","run":"python virtual_portfolio.py"},{"name":"Show results without saving","run":"echo '--- PORTFOLIO ---' && cat virtual_portfolio.csv && echo '--- CASH ---' && cat portfolio_cash.csv"}]}}}
