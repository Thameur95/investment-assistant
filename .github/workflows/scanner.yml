{"name":"Stock Scanner","on":{"workflow_dispatch":{},"schedule":[{"cron":"30 21 * * 1-5"}]},"permissions":{"contents":"write"},"jobs":{"scan":{"runs-on":"ubuntu-latest","steps":[{"name":"Checkout","uses":"actions/checkout@v4"},{"name":"Setup Python","uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"name":"Install packages","run":"pip install -r requirements.txt"},{"name":"Remove invisible spaces","run":"python -c \"from pathlib import Path; [p.write_text(p.read_text(encoding='utf-8').replace(chr(160),' '),encoding='utf-8') for p in [Path('scanner.py'),Path('news_scanner.py')] if p.exists()]\""},{"name":"Run scanners","run":"python scanner.py && python news_scanner.py"},{"name":"Save signal history","run":"git config user.name \"github-actions[bot]\" && git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\" && git add signals_history.csv && (git diff --cached --quiet || (git commit -m \"Update signal history\" && git push))"}]}}}
