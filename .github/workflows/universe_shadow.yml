name: Universe Expansion Shadow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universe-expansion-shadow
  cancel-in-progress: false

jobs:
  universe-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Verify Shadow universe file
        run: |
          test -s historical_lab/data/stocks_universe_shadow.txt
          echo "=== Universe Shadow ==="
          wc -l historical_lab/data/stocks_universe_shadow.txt
          cat historical_lab/data/stocks_universe_shadow.txt

      - name: Build isolated Shadow workspace
        run: |
          rm -rf historical_lab/universe_shadow
          mkdir -p historical_lab/universe_shadow/data/raw
          mkdir -p historical_lab/universe_shadow/data/processed
          mkdir -p historical_lab/universe_shadow/data/intraday
          mkdir -p historical_lab/universe_shadow/scripts
          mkdir -p historical_lab/universe_shadow/results

          cp historical_lab/data/stocks_universe_shadow.txt \
             historical_lab/universe_shadow/data/tickers.txt

          cp historical_lab/scripts/download_history.py \
             historical_lab/universe_shadow/scripts/download_history.py
          cp historical_lab/scripts/build_database.py \
             historical_lab/universe_shadow/scripts/build_database.py
          cp historical_lab/scripts/calculate_indicators.py \
             historical_lab/universe_shadow/scripts/calculate_indicators.py
          cp historical_lab/scripts/download_intraday.py \
             historical_lab/universe_shadow/scripts/download_intraday.py
          cp historical_lab/scripts/replay_intraday_monitor.py \
             historical_lab/universe_shadow/scripts/replay_intraday_monitor.py

      - name: Verify Shadow scripts
        run: |
          python -m py_compile historical_lab/universe_shadow/scripts/download_history.py
          python -m py_compile historical_lab/universe_shadow/scripts/build_database.py
          python -m py_compile historical_lab/universe_shadow/scripts/calculate_indicators.py
          python -m py_compile historical_lab/universe_shadow/scripts/download_intraday.py
          python -m py_compile historical_lab/universe_shadow/scripts/replay_intraday_monitor.py

      - name: Download Shadow daily history
        run: |
          python historical_lab/universe_shadow/scripts/download_history.py

      - name: Build Shadow historical database
        run: |
          python historical_lab/universe_shadow/scripts/build_database.py

      - name: Calculate Shadow indicators
        run: |
          python historical_lab/universe_shadow/scripts/calculate_indicators.py

      - name: Download Shadow intraday 5 minute data
        run: |
          python historical_lab/universe_shadow/scripts/download_intraday.py

      - name: Replay frozen V1 on Shadow universe
        run: |
          python historical_lab/universe_shadow/scripts/replay_intraday_monitor.py

      - name: Show Shadow summary
        run: |
          echo "=== Universe Shadow files ==="
          find historical_lab/universe_shadow/results -maxdepth 1 -type f -printf '%f\n' | sort
          echo
          echo "=== Risk Manager summary ==="
          if [ -s historical_lab/universe_shadow/results/risk_manager_summary.csv ]; then
            cat historical_lab/universe_shadow/results/risk_manager_summary.csv
          else
            echo "risk_manager_summary.csv absent"
          fi

      - name: Save Universe Shadow results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add historical_lab/universe_shadow/data/
          git add historical_lab/universe_shadow/results/

          if git diff --cached --quiet; then
            echo "Aucun nouveau resultat Universe Shadow a sauvegarder."
          else
            echo "=== Files to commit ==="
            git diff --cached --name-only
            git commit -m "Update Universe Expansion Shadow"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload Universe Shadow snapshot
        uses: actions/upload-artifact@v4
        with:
          name: universe_shadow_snapshot
          path: |
            historical_lab/universe_shadow/data/
            historical_lab/universe_shadow/results/
          if-no-files-found: error
          retention-days: 90
