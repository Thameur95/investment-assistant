name: WhatsApp Isolated Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whatsapp-test:
    runs-on: ubuntu-latest

    steps:
      - name: Validate WhatsApp secrets
        shell: bash
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_GRAPH_VERSION: ${{ secrets.WHATSAPP_GRAPH_VERSION }}
        run: |
          set -e
          for var in \
            WHATSAPP_ACCESS_TOKEN \
            WHATSAPP_PHONE_NUMBER_ID \
            WHATSAPP_RECIPIENT \
            WHATSAPP_TEMPLATE_NAME \
            WHATSAPP_TEMPLATE_LANGUAGE \
            WHATSAPP_GRAPH_VERSION
          do
            if [ -z "${!var}" ]; then
              echo "ERROR: Missing GitHub secret: $var"
              exit 1
            fi
          done
          echo "All WhatsApp secrets are present."

      - name: Send isolated WhatsApp template
        shell: bash
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_GRAPH_VERSION: ${{ secrets.WHATSAPP_GRAPH_VERSION }}
        run: |
          set -e

          HTTP_CODE=$(curl -sS \
            -o whatsapp_response.json \
            -w "%{http_code}" \
            -X POST \
            "https://graph.facebook.com/${WHATSAPP_GRAPH_VERSION}/${WHATSAPP_PHONE_NUMBER_ID}/messages" \
            -H "Authorization: Bearer ${WHATSAPP_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg to "$WHATSAPP_RECIPIENT" \
              --arg template "$WHATSAPP_TEMPLATE_NAME" \
              --arg language "$WHATSAPP_TEMPLATE_LANGUAGE" \
              '{
                messaging_product: "whatsapp",
                recipient_type: "individual",
                to: $to,
                type: "template",
                template: {
                  name: $template,
                  language: {
                    code: $language
                  }
                }
              }')")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "SUCCESS: WhatsApp API accepted the message."
            cat whatsapp_response.json
          else
            echo "ERROR: WhatsApp API rejected the message."
            cat whatsapp_response.json
            exit 1
          fi
